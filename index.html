<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>現在地マップ</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="現在地マップ" />
  <link rel="manifest" href="manifest.json" />

  <!-- Leaflet（地図ライブラリ）のCSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f5f7fa;
      color: #1f2937;
    }
    header {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    h1 {
      font-size: 1rem;
      margin: 0;
    }
    button {
      padding: 8px 14px;
      font-size: 0.9rem;
      border: none;
      border-radius: 10px;
      background-color: #007aff;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }
    button:active {
      opacity: 0.7;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    #status {
      padding: 8px 16px;
      font-size: 0.85rem;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <header>
    <h1>現在地マップ</h1>
    <button onclick="locateMe()">現在地を更新</button>
  </header>

  <div id="map"></div>
  <div id="status">現在地を取得しています...</div>

  <!-- Leaflet（地図ライブラリ）のJS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 初期表示の地図（仮で東京駅付近を中心にしておく）
    const map = L.map("map").setView([35.6812, 139.7671], 14);

    // 地図タイル（OpenStreetMap）を読み込む
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    let userMarker = null;
    let accuracyCircle = null;

    function locateMe() {
      const statusEl = document.getElementById("status");

      if (!navigator.geolocation) {
        statusEl.textContent = "このブラウザは位置情報に対応していません。";
        return;
      }

      statusEl.textContent = "現在地を取得中...";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);

          // 地図を現在地へ移動（ズーム16）
          map.setView([lat, lng], 16);

          // マーカーの更新
          if (userMarker) {
            userMarker.setLatLng([lat, lng]);
          } else {
            userMarker = L.marker([lat, lng])
              .addTo(map)
              .bindPopup("いまここ！")
              .openPopup();
          }

          // 誤差範囲の円を更新
          if (accuracyCircle) {
            accuracyCircle.setLatLng([lat, lng]).setRadius(acc);
          } else {
            accuracyCircle = L.circle([lat, lng], {
              radius: acc,
              color: "#007aff",
              fillColor: "#007aff",
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);
          }

          statusEl.textContent = `取得完了（誤差 約${acc}m）`;
        },
        (err) => {
          if (err.code === 1) {
            statusEl.textContent = "位置情報の利用が許可されていません。ブラウザの設定を確認してください。";
          } else {
            statusEl.textContent = "現在地を取得できませんでした。電波状況や位置情報設定を確認してください。";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // ページを開いたときに自動で1回現在地を取得
    locateMe();
  </script>
</body>
</html>
