<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>写真サムネイルマップ</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="写真マップ" />
  <link rel="manifest" href="manifest.json" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f5f7fa;
      color: #1f2937;
    }
    header {
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    h1 {
      font-size: 1rem;
      margin: 0;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button, .file-btn {
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .file-btn {
      background-color: #007aff;
      color: #ffffff;
    }
    .secondary-btn {
      background-color: #e5e7eb;
      color: #374151;
    }
    input[type="file"] {
      display: none;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    /* 地図上のサムネイルピン */
    .photo-pin {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .photo-pin img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-card {
      text-align: center;
      max-width: 220px;
    }
    .popup-card img {
      width: 200px;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
    }
    .popup-time {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .popup-note {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .popup-del {
      padding: 4px 10px;
      font-size: 0.75rem;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 6px;
    }
    #status {
      padding: 8px 14px;
      font-size: 0.82rem;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <header>
    <h1>写真マップ</h1>
    <div class="controls">
      <label class="file-btn">
        ＋ 写真を残す
        <input type="file" id="photoInput" accept="image/*" />
      </label>
      <button class="secondary-btn" onclick="moveToCurrentLocation()">現在地</button>
    </div>
  </header>

  <div id="map"></div>
  <div id="status">「＋ 写真を残す」で撮影または写真を選ぶと、地図にサムネイルが貼られます</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const STORAGE_KEY = "photo_map_pins_v1";

    const map = L.map("map").setView([35.6812, 139.7671], 15);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    // [{ id, lat, lng, thumbDataUrl, fullDataUrl, note, createdAt }]
    let photoPins = [];
    const markerLayer = L.layerGroup().addTo(map);

    function savePins() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photoPins));
      } catch (e) {
        alert("保存容量がいっぱいに近づいています。不要な写真ピンを削除してください。");
      }
    }

    function loadPins() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            photoPins = parsed;
          }
        }
      } catch (e) {
        photoPins = [];
      }
    }

    // 画像をリサイズしてデータURL化（容量節約＆高速表示のため）
    function resizeImage(file, maxSize, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function formatTime(isoStr) {
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "";
      return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function renderAllPins() {
      markerLayer.clearLayers();

      photoPins.forEach((pin) => {
        const icon = L.divIcon({
          className: "",
          html: `<div class="photo-pin"><img src="${pin.thumbDataUrl}" alt="photo" /></div>`,
          iconSize: [56, 56],
          iconAnchor: [28, 28],
          popupAnchor: [0, -28]
        });

        const marker = L.marker([pin.lat, pin.lng], { icon }).addTo(markerLayer);

        const popupDiv = document.createElement("div");
        popupDiv.className = "popup-card";
        popupDiv.innerHTML = `
          <img src="${pin.fullDataUrl}" alt="photo" />
          <div class="popup-time">${formatTime(pin.createdAt)}</div>
          <div class="popup-note">${pin.note ? escapeHtml(pin.note) : "メモなし"}</div>
        `;

        const delBtn = document.createElement("button");
        delBtn.className = "popup-del";
        delBtn.textContent = "この写真を削除";
        delBtn.onclick = () => deletePin(pin.id);

        popupDiv.appendChild(delBtn);
        marker.bindPopup(popupDiv);
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function deletePin(id) {
      if (!confirm("この写真ピンを削除しますか？")) return;
      photoPins = photoPins.filter((p) => p.id !== id);
      savePins();
      renderAllPins();
      document.getElementById("status").textContent = "写真ピンを削除しました";
    }

    function getCurrentPosOnce() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation unavailable"));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          (err) => reject(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
        );
      });
    }

    function moveToCurrentLocation() {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "現在地を取得中...";
      getCurrentPosOnce()
        .then(({ lat, lng }) => {
          map.setView([lat, lng], 16);
          statusEl.textContent = "現在地に移動しました";
        })
        .catch(() => {
          statusEl.textContent = "現在地を取得できませんでした";
        });
    }

    document.getElementById("photoInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById("status");
      statusEl.textContent = "写真を処理して位置を取得中...";

      try {
        // サムネイル(140px)と拡大表示用(640px)を生成
        const [thumbDataUrl, fullDataUrl] = await Promise.all([
          resizeImage(file, 140, 0.75),
          resizeImage(file, 640, 0.8)
        ]);

        let lat, lng;
        try {
          const pos = await getCurrentPosOnce();
          lat = pos.lat;
          lng = pos.lng;
        } catch (geoErr) {
          // 位置情報が取れない場合は今見ている地図の中心に置く
          const center = map.getCenter();
          lat = center.lat;
          lng = center.lng;
        }

        const note = prompt("ひとことメモ（空欄でもOK）", "") || "";

        const newPin = {
          id: String(Date.now()),
          lat,
          lng,
          thumbDataUrl,
          fullDataUrl,
          note,
          createdAt: new Date().toISOString()
        };

        photoPins.push(newPin);
        savePins();
        renderAllPins();
        map.setView([lat, lng], 16);
        statusEl.textContent = `写真を追加しました（合計 ${photoPins.length}枚）`;
      } catch (err) {
        statusEl.textContent = "写真の読み込みに失敗しました";
      } finally {
        e.target.value = "";
      }
    });

    // 初期起動
    loadPins();
    renderAllPins();

    if (photoPins.length > 0) {
      const last = photoPins[photoPins.length - 1];
      map.setView([last.lat, last.lng], 15);
    } else {
      moveToCurrentLocation();
    }
  </script>
</body>
</html>
