<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>撮影場所フォトマップ</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="フォトマップ" />
  <link rel="manifest" href="manifest.json" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f5f7fa;
      color: #1f2937;
    }
    header {
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    h1 {
      font-size: 1rem;
      margin: 0;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button, .file-btn {
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .file-btn {
      background-color: #007aff;
      color: #ffffff;
    }
    .secondary-btn {
      background-color: #e5e7eb;
      color: #374151;
    }
    input[type="file"] {
      display: none;
    }
    #map {
      flex: 1;
      width: 100%;
    }
    .photo-pin {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      background: #fff;
    }
    .photo-pin img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-card {
      text-align: center;
      max-width: 220px;
    }
    .popup-card img {
      width: 200px;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
    }
    .popup-meta {
      font-size: 0.76rem;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .popup-del {
      padding: 4px 10px;
      font-size: 0.75rem;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 6px;
    }
    #status {
      padding: 8px 14px;
      font-size: 0.82rem;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <header>
    <h1>撮影場所フォトマップ</h1>
    <div class="controls">
      <label class="file-btn">
        写真を選ぶ（複数可）
        <input type="file" id="photoInput" accept="image/*" multiple />
      </label>
      <button class="secondary-btn" onclick="fitAllPhotos()">全体表示</button>
    </div>
  </header>

  <div id="map"></div>
  <div id="status">「写真を選ぶ」から写真を選ぶと、位置情報（GPS）がある写真だけ撮影場所に表示します</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- HEIC / HEIF 対応の full 版を読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

  <script>
    const STORAGE_KEY = "exif_photo_map_v1";

    const map = L.map("map").setView([35.6812, 139.7671], 14);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    let photos = [];
    const markerLayer = L.layerGroup().addTo(map);

    function getGpsPhotos() {
      return photos.filter((p) => p.hasGps && typeof p.lat === "number" && typeof p.lng === "number");
    }

    function savePhotos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        return true;
      } catch (e) {
        return false;
      }
    }

    function loadPhotos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            photos = parsed;
          }
        }
      } catch (e) {
        photos = [];
      }
    }

    function resizeImage(file, maxSize, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function extractGpsAndDate(file) {
      try {
        // full版でHEIC/JPEGどちらからもGPSと日時を抽出
        const gps = await exifr.gps(file);
        const meta = await exifr.parse(file, ["DateTimeOriginal", "CreateDate"]);
        const rawDate = meta?.DateTimeOriginal || meta?.CreateDate || null;
        let takenAt = "";
        if (rawDate instanceof Date && !isNaN(rawDate.getTime())) {
          takenAt = `${rawDate.getMonth() + 1}/${rawDate.getDate()} ${String(rawDate.getHours()).padStart(2, "0")}:${String(rawDate.getMinutes()).padStart(2, "0")}`;
        }
        if (gps && typeof gps.latitude === "number" && typeof gps.longitude === "number" && !isNaN(gps.latitude) && !isNaN(gps.longitude)) {
          return {
            lat: gps.latitude,
            lng: gps.longitude,
            hasGps: true,
            takenAt
          };
        }
        return { lat: null, lng: null, hasGps: false, takenAt };
      } catch (err) {
        return { lat: null, lng: null, hasGps: false, takenAt: "" };
      }
    }

    function renderMarkers() {
      markerLayer.clearLayers();
      const visiblePhotos = getGpsPhotos();

      visiblePhotos.forEach((item) => {
        const icon = L.divIcon({
          className: "",
          html: `<div class="photo-pin"><img src="${item.thumbDataUrl}" alt="photo" /></div>`,
          iconSize: [56, 56],
          iconAnchor: [28, 28],
          popupAnchor: [0, -28]
        });

        const marker = L.marker([item.lat, item.lng], { icon }).addTo(markerLayer);

        const popupDiv = document.createElement("div");
        popupDiv.className = "popup-card";
        const timeLabel = item.takenAt ? `撮影: ${item.takenAt}` : "GPS位置情報あり";

        popupDiv.innerHTML = `
          <img src="${item.fullDataUrl}" alt="photo" />
          <div class="popup-meta">${timeLabel}</div>
        `;

        const delBtn = document.createElement("button");
        delBtn.className = "popup-del";
        delBtn.textContent = "削除";
        delBtn.onclick = () => deletePhoto(item.id);

        popupDiv.appendChild(delBtn);
        marker.bindPopup(popupDiv);
      });
    }

    function deletePhoto(id) {
      photos = photos.filter((p) => p.id !== id);
      savePhotos();
      renderMarkers();
      const count = getGpsPhotos().length;
      document.getElementById("status").textContent = `写真を削除しました（地図上 ${count}枚）`;
    }

    function fitAllPhotos() {
      const visiblePhotos = getGpsPhotos();
      if (visiblePhotos.length === 0) return;
      const bounds = L.latLngBounds(visiblePhotos.map((p) => [p.lat, p.lng]));
      map.fitBounds(bounds, { padding: [35, 35] });
    }

    document.getElementById("photoInput").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;

      const statusEl = document.getElementById("status");
      statusEl.textContent = `${files.length}枚の写真から位置情報（GPS）を確認中...`;

      let addedGpsCount = 0;
      let skippedNoGpsCount = 0;
      let lastFileType = "";

      for (const file of files) {
        lastFileType = file.type || file.name.split(".").pop() || "unknown";
        const info = await extractGpsAndDate(file);

        if (!info.hasGps) {
          skippedNoGpsCount++;
          continue;
        }

        try {
          const [thumbDataUrl, fullDataUrl] = await Promise.all([
            resizeImage(file, 140, 0.72),
            resizeImage(file, 560, 0.75)
          ]);

          const candidate = {
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            lat: info.lat,
            lng: info.lng,
            hasGps: true,
            thumbDataUrl,
            fullDataUrl,
            takenAt: info.takenAt
          };

          photos.push(candidate);
          if (!savePhotos()) {
            photos.pop();
            alert("保存容量の上限に達したため、これ以上の写真は保存できませんでした。");
            break;
          }
          addedGpsCount++;
        } catch (err) {
          // 読み込めない画像形式はスキップ
        }
      }

      renderMarkers();
      if (addedGpsCount > 0) {
        fitAllPhotos();
      }

      const totalVisible = getGpsPhotos().length;
      statusEl.textContent =
        `追加 ${addedGpsCount}枚 ／ 位置情報なし ${skippedNoGpsCount}枚（形式: ${lastFileType} ／ 合計 ${totalVisible}枚）`;

      e.target.value = "";
    });

    loadPhotos();
    renderMarkers();
    const initialVisible = getGpsPhotos();
    if (initialVisible.length > 0) {
      fitAllPhotos();
    }
  </script>
</body>
</html>
